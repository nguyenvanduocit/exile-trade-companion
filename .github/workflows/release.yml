name: Release

# Bump `version` trong package.json rồi push lên main là release. Tag `v<version>` là dấu đã release:
# có rồi thì bỏ qua, chưa có thì build + upload draft CWS + tạo GitHub Release (tạo luôn tag).
on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - '.github/workflows/release.yml'
  # Chạy lại trên main mới nhất sau khi sửa lỗi bằng commit không đụng package.json: gh workflow run release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      released: ${{ steps.read.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version and check tag
        id: read
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # exit 0 = có tag, 2 = không có; mã khác là lỗi mạng/auth, fail thay vì release trùng.
          code=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || code=$?
          case $code in
            0) echo "released=true" >> "$GITHUB_OUTPUT"; echo "v$version đã release, bỏ qua." ;;
            2) echo "released=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::git ls-remote lỗi (exit $code)"; exit "$code" ;;
          esac

  release:
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build + zip extension
        # VITE_* được Vite inline vào bundle lúc build — thiếu thì folder share (Liveblocks) và telemetry chết trong bản store.
        env:
          VITE_LIVEBLOCKS_PUBLIC_KEY: ${{ secrets.VITE_LIVEBLOCKS_PUBLIC_KEY }}
          VITE_DATADOG_CLIENT_TOKEN: ${{ secrets.VITE_DATADOG_CLIENT_TOKEN }}
          VITE_DATADOG_SITE: ${{ secrets.VITE_DATADOG_SITE }}
        run: bun run zip

      - name: Locate zip
        id: zip
        run: echo "path=$(ls .output/*-chrome.zip)" >> "$GITHUB_OUTPUT"

      - name: Upload draft to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: ${{ steps.zip.outputs.path }}
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          # Chỉ upload draft — KHÔNG tự publish. Submit for review vẫn cần bấm thủ công trên
          # Chrome Web Store Developer Dashboard.
          publish: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.zip.outputs.path }}
          generate_release_notes: true
